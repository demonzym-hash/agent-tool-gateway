services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: atg
      POSTGRES_PASSWORD: atg
      POSTGRES_DB: atg
    expose:
      - "5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U atg -d atg"]
      interval: 5s
      timeout: 5s
      retries: 10

  mock-api:
    build:
      context: ./examples/mock-api
    environment:
      PORT: 9090
      LOG_LEVEL: info
    expose:
      - "9090"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:9090/healthz').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\""]
      interval: 5s
      timeout: 5s
      retries: 10

  server:
    build:
      context: ./server
    environment:
      PORT: 8080
      DATABASE_URL: postgres://atg:atg@postgres:5432/atg
      LOG_LEVEL: info
      ADMIN_TOKEN: ${ADMIN_TOKEN:-}
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY before starting the server deployment}
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:8080/healthz').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    depends_on:
      postgres:
        condition: service_healthy
      mock-api:
        condition: service_healthy

  web:
    build:
      context: ./web
    ports:
      - "${WEB_PORT:-5173}:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    depends_on:
      server:
        condition: service_healthy

volumes:
  postgres_data:
